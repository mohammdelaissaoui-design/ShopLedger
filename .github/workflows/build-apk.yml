name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Capacitor App with Storage Permissions
      run: |
        mkdir -p www
        cp index.html www/
        npm init -y
        npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4 @capacitor/filesystem@5.2.1
        npx cap init ShopLedger com.elaissaoui.shopledger --web-dir www
        npx cap add android

        # حقن صلاحيات الذاكرة وقراءة وكتابة الملفات داخل ملف AndroidManifest
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' $MANIFEST

        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ShopLedger-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
